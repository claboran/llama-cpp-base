# Qwen3.8-27B as a competitor to the Gemma chat service, run side by side for A/B tests.
#   docker compose -f compose.qwen.yaml --profile qwen up -d     (or: make up-qwen)
# Reuses image, build, GPU, volumes and auth/CORS settings from llm-chat in compose.yaml;
# only the model, port and server options differ. Settings: QWEN_* in .env.
#
# Qwen3.8-27B is dense (all 27B params active per token), unlike Gemma 4 26B-A4B (MoE, ~4B
# active), so expect much lower tokens/s. It uses hybrid attention: only every 4th layer
# (16 of 64) has a KV cache, ~64 KiB/token at f16 → ~4 GiB for 64k context.

name: llama-cpp-qwen

services:
  llm-qwen:
    extends:
      file: compose.yaml
      service: llm-chat
    profiles: !override [qwen]
    ports: !override
      - "${QWEN_BIND:-0.0.0.0}:${QWEN_PORT:-8098}:8080"
    command:
      - --model
      - "/models/${QWEN_MODEL:-Qwen3.8-27B-Q4_K_M.gguf}"
      - --alias
      - "${QWEN_ALIAS:-qwen3.8-27b}"
      - --ctx-size
      - "${QWEN_CTX:-65536}"
      - --parallel
      - "${QWEN_PARALLEL:-1}"
      - --n-gpu-layers
      - "999"
      - --flash-attn
      - "on"
      - --cache-type-k
      - "${QWEN_CACHE_TYPE:-f16}"
      - --cache-type-v
      - "${QWEN_CACHE_TYPE:-f16}"
      # MTP speculative decoding: the GGUF ships Multi-Token-Prediction layers as a built-in
      # draft model. 2.5-3.5x generation speed on GB10; QWEN_SPEC_TYPE=none disables it.
      - --spec-type
      - "${QWEN_SPEC_TYPE:-draft-mtp}"
      - --spec-draft-n-max
      - "${QWEN_DRAFT_N:-4}"
      - --jinja
      - --metrics
      - --port
      - "8080"

networks:
  # Shared by compose.yaml, compose.qwen.yaml and compose.monitoring.yaml. Created once by
  # `make network` (or: docker network create llm-metrics); no stack owns or removes it.
  metrics:
    name: llm-metrics
    external: true
